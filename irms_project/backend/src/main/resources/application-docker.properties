spring.application.name=irms-docker

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:irms}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:123456}

spring.flyway.enabled=${IRMS_FLYWAY_ENABLED:false}
irms.rabbitmq.enabled=${IRMS_RABBITMQ_ENABLED:true}
irms.legacy-db-fanout.enabled=false
