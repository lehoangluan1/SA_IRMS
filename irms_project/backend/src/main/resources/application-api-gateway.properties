spring.application.name=irms-api-gateway
server.port=${SERVER_PORT:${API_GATEWAY_PORT:8080}}
irms.runtime.mode=api-gateway
irms.service.name=api-gateway
irms.gateway.ordering-base-url=${ORDERING_SERVICE_URL:http://localhost:8081}
irms.gateway.kitchen-base-url=${KITCHEN_SERVICE_URL:http://localhost:8082}
irms.gateway.billing-base-url=${BILLING_SERVICE_URL:http://localhost:8083}
irms.gateway.reservation-base-url=${RESERVATION_SERVICE_URL:http://localhost:8084}
irms.gateway.inventory-base-url=${INVENTORY_SERVICE_URL:http://localhost:8085}
irms.gateway.notification-base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
irms.gateway.reporting-base-url=${REPORTING_SERVICE_URL:http://localhost:8087}
irms.gateway.identity-base-url=${IDENTITY_SERVICE_URL:http://localhost:8088}
irms.remote.identity-base-url=${IDENTITY_SERVICE_URL:http://localhost:8088}
spring.flyway.enabled=false
irms.legacy-db-fanout.enabled=false
irms.rabbitmq.enabled=${IRMS_RABBITMQ_ENABLED:true}
