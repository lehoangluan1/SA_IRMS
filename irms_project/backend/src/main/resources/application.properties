spring.application.name=irms
server.port=${SERVER_PORT:${APP_PORT:8080}}

irms.runtime.mode=${IRMS_RUNTIME_MODE:ordering-service}

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:irms}}
spring.datasource.username=${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=${IRMS_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.jackson.default-property-inclusion=non_null

server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

irms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081}
irms.security.session-idle-timeout-minutes=${APP_SESSION_IDLE_TIMEOUT_MINUTES:15}
irms.security.session-absolute-timeout-hours=${APP_SESSION_ABSOLUTE_TIMEOUT_HOURS:12}
irms.security.access-token-lifetime-minutes=${IRMS_ACCESS_TOKEN_LIFETIME_MINUTES:15}
irms.security.session-touch-debounce-seconds=${IRMS_SESSION_TOUCH_DEBOUNCE_SECONDS:60}
irms.security.access-token-introspection-seconds=${IRMS_ACCESS_TOKEN_INTROSPECTION_SECONDS:60}
irms.security.password-demo-default=${APP_DEMO_PASSWORD:Password123!}
irms.restaurant.name=${APP_RESTAURANT_NAME:IRMS Demo Restaurant}
irms.restaurant.timezone=${APP_RESTAURANT_TIMEZONE:UTC}
irms.restaurant.currency=${APP_RESTAURANT_CURRENCY:USD}
irms.reporting.projection-refresh-seconds=${APP_REPORT_PROJECTION_REFRESH_SECONDS:120}
irms.notifications.low-stock-sla-seconds=${APP_LOW_STOCK_ALERT_SLA_SECONDS:60}
irms.receipts.mail-from=${IRMS_RECEIPT_MAIL_FROM:no-reply@irms.local}
irms.kitchen-automation.poll-seconds=${IRMS_KITCHEN_AUTOMATION_POLL_SECONDS:5}
irms.kitchen-automation.cooking-to-ready-seconds=${IRMS_KITCHEN_COOKING_TO_READY_SECONDS:180}
irms.kitchen-automation.ready-to-served-seconds=${IRMS_KITCHEN_READY_TO_SERVED_SECONDS:120}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}

irms.outbox.poll-millis=${IRMS_OUTBOX_POLL_MILLIS:2000}
irms.outbox.rabbit.poll-millis=${IRMS_OUTBOX_RABBIT_POLL_MILLIS:1000}
irms.outbox.rabbit.batch-size=${IRMS_OUTBOX_RABBIT_BATCH_SIZE:50}
irms.outbox.rabbit.max-retries=${IRMS_OUTBOX_RABBIT_MAX_RETRIES:8}
irms.outbox.rabbit.base-backoff-seconds=${IRMS_OUTBOX_RABBIT_BASE_BACKOFF_SECONDS:15}
irms.rabbitmq.enabled=${IRMS_RABBITMQ_ENABLED:false}
irms.rabbitmq.consumer.max-retries=${IRMS_RABBITMQ_CONSUMER_MAX_RETRIES:5}
irms.rabbitmq.publisher-confirm-timeout-millis=${IRMS_RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT_MILLIS:5000}
irms.legacy-db-fanout.enabled=${IRMS_LEGACY_DB_FANOUT_ENABLED:false}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:123456}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

irms.security.internal-service-token=${IRMS_INTERNAL_SERVICE_TOKEN:dev-internal-service-token-change-me}
irms.security.access-token-signing-secret=${IRMS_ACCESS_TOKEN_SIGNING_SECRET:dev-access-token-signing-secret-change-me}
