spring.application.name=irms-kitchen-service
server.port=${SERVER_PORT:${KITCHEN_SERVICE_PORT:8082}}
irms.runtime.mode=kitchen-service
irms.service.name=kitchen-service
irms.remote.ordering-base-url=${ORDERING_SERVICE_URL:http://localhost:8081}
irms.remote.inventory-base-url=${INVENTORY_SERVICE_URL:http://localhost:8085}
irms.remote.identity-base-url=${IDENTITY_SERVICE_URL:http://localhost:8088}
spring.flyway.enabled=false
irms.legacy-db-fanout.enabled=false
irms.rabbitmq.enabled=${IRMS_RABBITMQ_ENABLED:true}
