spring.application.name=irms-migration
server.port=${SERVER_PORT:0}
spring.main.web-application-type=none

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:irms}}
spring.datasource.username=${DB_USER:irms}
spring.datasource.password=${DB_PASSWORD:irms_dev_password}

spring.flyway.enabled=${IRMS_FLYWAY_ENABLED:true}
irms.rabbitmq.enabled=false
irms.legacy-db-fanout.enabled=false
