services:
  postgres:
    image: postgres:16
    container_name: irms-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-irms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-irms}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: irms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-postgre}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-123456}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  irms-migration:
    image: irms-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: irms-migration
    environment: &irms-common-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-irms}
      DB_USER: ${DB_USER:-postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-irms}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-postgre}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-123456}
      IRMS_RABBITMQ_ENABLED: "false"
      IRMS_LEGACY_DB_FANOUT_ENABLED: "false"
      IRMS_FLYWAY_ENABLED: "true"
      IRMS_RUNTIME_MODE: migration
      IRMS_RUNTIME_SERVICE: migration
      SPRING_PROFILES_ACTIVE: docker,migration
      SERVER_PORT: 0
      JAVA_OPTS: ${JAVA_OPTS:-}
      MAIL_HOST: ${MAIL_HOST:-host.docker.internal}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-false}
      IRMS_INTERNAL_SERVICE_TOKEN: ${IRMS_INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-me}
      IRMS_ACCESS_TOKEN_SIGNING_SECRET: ${IRMS_ACCESS_TOKEN_SIGNING_SECRET:-dev-access-token-signing-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-gateway:
    image: irms-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: irms-api-gateway
    environment:
      <<: *irms-common-env
      IRMS_RABBITMQ_ENABLED: "true"
      IRMS_FLYWAY_ENABLED: "false"
      IRMS_RUNTIME_MODE: api-gateway
      IRMS_RUNTIME_SERVICE: api-gateway
      SPRING_PROFILES_ACTIVE: docker,api-gateway
      SERVER_PORT: 8080
      ORDERING_SERVICE_URL: http://ordering-service:8081
      KITCHEN_SERVICE_URL: http://kitchen-service:8082
      BILLING_SERVICE_URL: http://billing-service:8083
      RESERVATION_SERVICE_URL: http://reservation-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      REPORTING_SERVICE_URL: http://reporting-service:8087
      IDENTITY_SERVICE_URL: http://identity-audit-service:8088
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      irms-migration:
        condition: service_completed_successfully
      ordering-service:
        condition: service_healthy
      kitchen-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
      identity-audit-service:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ordering-service:
    image: irms-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
